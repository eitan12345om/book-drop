name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error message
      description: >-
        The exact error BookDrop showed, including its reference if it gave one
        (e.g. "Reference: 7F3A9C21"). The "Report this problem" link fills this in for you.
      render: text
  - type: input
    id: time
    attributes:
      label: When did it happen?
      description: Roughly, with your time zone. This is how the matching server logs are found.
      placeholder: Nov 1, around 11:45 AM PST
  - type: dropdown
    id: other-files
    attributes:
      label: Does it happen with other files?
      options:
        - Only this file
        - Every file I've tried
        - I haven't tried another file
  - type: input
    id: device-file
    attributes:
      label: E-reader and file
      description: >-
        The e-reader's model and firmware if you know them, then the file's type, size, and the
        conversion options you checked.
      placeholder: Kobo Clara 2E, firmware 4.38; EPUB, 2.3 MB, Kobo format
  - type: input
    id: install
    attributes:
      label: Where are you running BookDrop, and which version?
      description: >-
        bookdrop.cc, or self-hosted with Docker or Node.js. The version is shown at the bottom of
        the page.
      placeholder: bookdrop.cc, version a1b2c3d
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Error messages, screenshots, or server logs if you self-host.
