name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm lint
      - run: pnpm format:check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e

  docker:
    # Production runs on arm64, so the image that passes these checks is the one that gets deployed.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        # Compiling kindling takes minutes; the registry cache skips it unless its pin changes.
        # Only main writes the cache, so PRs can't poison what gets deployed.
        env:
          CACHE: ghcr.io/${{ github.repository }}:buildcache
          GH_TOKEN: ${{ github.token }}
          ON_MAIN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          docker buildx create --use --driver docker-container
          cache_to=()
          if [ "$ON_MAIN" = true ]; then
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            cache_to=(--cache-to "type=registry,ref=$CACHE,mode=max")
          fi
          docker buildx build --load -t book-drop:ci \
            --build-arg "BOOKDROP_VERSION=${GITHUB_SHA::7}" \
            --cache-from "type=registry,ref=$CACHE" "${cache_to[@]}" .
      - name: Smoke-test the image
        run: |
          # Same hardening as docker-compose.yaml.
          docker run -d --name book-drop -p 3001:3001 --init --cap-drop ALL \
            --security-opt no-new-privileges:true --pids-limit 256 book-drop:ci
          for _ in $(seq 30); do
            curl -fsS http://localhost:3001/health && break
            sleep 2
          done
          curl -fsS http://localhost:3001/health | grep -q "\"version\":\"${GITHUB_SHA::7}\""
          # Production sits behind a TLS-terminating proxy; plain HTTP gets a 400.
          get() { curl -fsS -H 'X-Forwarded-Proto: https' "$@"; }
          # Fetches the page, checks it's the expected variant, then fetches every JS/CSS file it references.
          check_page() {
            local expected_script=$1 page asset
            shift
            page=$(get "$@" http://localhost:3001/)
            grep -q "src=\"$expected_script\"" <<< "$page"
            while read -r asset; do
              echo "GET /$asset"
              get -o /dev/null "http://localhost:3001/$asset"
            done < <(grep -oE '(src|href)="[a-z-]+\.(js|css)"' <<< "$page" | cut -d'"' -f2 | sort -u)
          }
          check_page upload.js
          check_page download.js -A 'Mozilla/5.0 (Linux) AppleWebKit/538.1 Kobo Touch'
      - name: Convert real books with the image's kindling
        # The suite skips kindling if it can't find it, so check first that the image has it.
        run: |
          docker run --rm -v "$PWD/tests:/usr/src/app/tests:ro" book-drop:ci sh -c \
            'kindling-cli --version && node --test tests/integration/'
      - name: Publish the tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag book-drop:ci "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:$GITHUB_SHA"
      - if: failure()
        run: docker logs book-drop

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.12 -color
      - name: zizmor
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo -e GH_TOKEN ghcr.io/zizmorcore/zizmor:1.31.1 --format github .
        env:
          GH_TOKEN: ${{ github.token }}

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: pnpm audit --audit-level high

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [typecheck, lint, test, e2e, docker, workflows, audit]
    runs-on: ubuntu-latest
    environment: production
    # Let a running deploy finish; a newer push replaces any deploy still waiting.
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      id-token: write
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
      - name: Trigger deploy over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: deploy ${{ github.sha }}
