name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm lint
      - run: pnpm format:check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t book-drop:ci .
      - name: Smoke-test the image
        run: |
          docker run -d --name book-drop -p 3001:3001 book-drop:ci
          for _ in $(seq 30); do
            curl -fsS http://localhost:3001/health && break
            sleep 2
          done
          curl -fsS http://localhost:3001/health
          # Production sits behind a TLS-terminating proxy; plain HTTP gets a 400.
          upload_page=$(curl -fsS -H 'X-Forwarded-Proto: https' http://localhost:3001/)
          grep -q 'upload.js' <<< "$upload_page"
          ereader_page=$(curl -fsS -H 'X-Forwarded-Proto: https' \
            -A 'Mozilla/5.0 (Linux) AppleWebKit/538.1 Kobo Touch' http://localhost:3001/)
          grep -q 'download.js' <<< "$ereader_page"
      - if: failure()
        run: docker logs book-drop
