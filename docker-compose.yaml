services:
  book-drop:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: book-drop
    restart: unless-stopped
    ports:
      - '${PORT:-3001}:${PORT:-3001}'
    # Conversions are CPU-bound and each one needs roughly 250 MB, so these are what
    # actually decide conversion throughput. Defaults suit a 1-vCPU host; see the README
    # before raising MAX_CONCURRENT_CONVERSIONS to match.
    cpus: ${CPUS:-1.0}
    mem_limit: ${MEM_LIMIT:-1g}
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    env_file:
      - path: .env
        required: false
    environment:
      - PORT
