services:
  book-drop:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: book-drop
    restart: unless-stopped
    ports:
      - '${PORT:-3001}:${PORT:-3001}'
    # Conversions are CPU-bound and each one needs roughly 250 MB, so these decide
    # conversion throughput. CPUS reaches the app through env_file below, which sizes
    # the concurrency limit from it. Defaults suit a 1-vCPU host.
    cpus: ${CPUS:-1.0}
    mem_limit: ${MEM_LIMIT:-2g}
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    env_file:
      - path: .env
        required: false
    environment:
      - PORT
