services:
  book-drop:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: book-drop
    restart: unless-stopped
    ports:
      - '${PORT:-3001}:${PORT:-3001}'
    # Conversions are CPU-bound and each one needs roughly 250 MB, so these decide
    # conversion throughput. The app sizes its concurrency limit from CPUS, passed in
    # below. Defaults suit a 1-vCPU host.
    cpus: ${CPUS:-1.0}
    mem_limit: ${MEM_LIMIT:-2g}
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    env_file:
      - path: .env
        required: false
    environment:
      - PORT
      # Resolved the same way as `cpus` above, so a shell override reaches both.
      - CPUS=${CPUS:-1.0}
